<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 210" width="100%" height="100%">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="yellowTag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="750" height="210" rx="14" fill="url(#redGrad)"/>

  <!-- Subtle circles pattern -->
  <circle cx="20" cy="20" r="80" fill="rgba(255,255,255,0.05)"/>
  <circle cx="450" cy="180" r="100" fill="rgba(255,255,255,0.06)"/>

  <!-- Left Header Area -->
  <g transform="translate(30, 45)">
    <text x="0" y="32" font-family="'Segoe UI', Inter, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF">Career Start</text>
    
    <!-- Yellow Oval Badge "Karne ka" -->
    <g transform="translate(-4, 38)">
      <rect x="0" y="0" width="80" height="22" rx="11" fill="url(#yellowTag)"/>
      <text x="40" y="16" font-family="'Segoe UI', Inter, sans-serif" font-weight="800" font-size="12" fill="#B91C1C" text-anchor="middle">Karne ka</text>
    </g>

    <!-- Arrow icon -->
    <path d="M 120 48 Q 140 40 155 52" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="156,48 160,54 153,55" fill="#FFFFFF"/>

    <!-- "Right Time ? Abhi!" -->
    <text x="0" y="94" font-family="'Segoe UI', Inter, sans-serif" font-weight="900" font-size="30" fill="#FFFFFF">Right Time ? <tspan fill="#FEF08A">Abhi!</tspan></text>
  </g>

  <!-- Middle Details Section -->
  <g transform="translate(260, 40)">
    <text x="0" y="24" font-family="'Segoe UI', Inter, sans-serif" font-weight="700" font-size="14.5" fill="#FFF1F2">Experience ke saath, financial support!</text>
    <text x="0" y="52" font-family="'Segoe UI', Inter, sans-serif" font-weight="900" font-size="21" fill="#FFFFFF">Minimum ₹9,000/month</text>
    
    <!-- Bullet points -->
    <g transform="translate(0, 75)">
      <text x="0" y="0" font-family="'Segoe UI', Inter, sans-serif" font-weight="500" font-size="12.5" fill="#FFE4E6">• Internship duration – 6 / 9 months</text>
      <text x="0" y="20" font-family="'Segoe UI', Inter, sans-serif" font-weight="500" font-size="12.5" fill="#FFE4E6">• Youth between 18–26 can apply</text>
    </g>
  </g>

  <!-- Right: Students Vector Graphic -->
  <g transform="translate(540, 30)">
    <!-- Student 1 -->
    <g transform="translate(0, 20)">
      <circle cx="28" cy="22" r="14" fill="#FCD9BD"/>
      <path d="M 14 18 Q 28 8 42 18 Q 42 30 14 30 Z" fill="#334155"/>
      <path d="M 10 50 Q 28 40 46 50 L 44 95 L 12 95 Z" fill="#3B82F6"/>
      <!-- ID Badge -->
      <rect x="22" y="55" width="12" height="16" rx="2" fill="#FFFFFF"/>
      <rect x="24" y="58" width="8" height="4" fill="#3B82F6"/>
    </g>

    <!-- Student 2 (Center prominent female) -->
    <g transform="translate(36, 30)">
      <circle cx="28" cy="20" r="14" fill="#FCD9BD"/>
      <path d="M 10 24 Q 28 5 46 24 Q 48 45 8 45 Z" fill="#1E293B"/>
      <path d="M 10 50 Q 28 42 46 50 L 44 95 L 12 95 Z" fill="#F43F5E"/>
      <!-- ID Badge -->
      <rect x="22" y="56" width="12" height="16" rx="2" fill="#FFFFFF"/>
      <rect x="24" y="59" width="8" height="4" fill="#F43F5E"/>
    </g>

    <!-- Student 3 -->
    <g transform="translate(72, 18)">
      <circle cx="28" cy="22" r="14" fill="#FCD9BD"/>
      <path d="M 14 18 Q 28 6 42 18 Q 42 30 14 30 Z" fill="#0F172A"/>
      <path d="M 10 50 Q 28 40 46 50 L 44 95 L 12 95 Z" fill="#10B981"/>
      <rect x="22" y="55" width="12" height="16" rx="2" fill="#FFFFFF"/>
    </g>

    <!-- Student 4 (Female) -->
    <g transform="translate(108, 28)">
      <circle cx="28" cy="20" r="14" fill="#FCD9BD"/>
      <path d="M 10 22 Q 28 5 46 22 Q 50 42 6 42 Z" fill="#475569"/>
      <path d="M 10 50 Q 28 42 46 50 L 44 95 L 12 95 Z" fill="#8B5CF6"/>
      <rect x="22" y="56" width="12" height="16" rx="2" fill="#FFFFFF"/>
    </g>

    <!-- Student 5 -->
    <g transform="translate(142, 20)">
      <circle cx="26" cy="22" r="13" fill="#FCD9BD"/>
      <path d="M 14 18 Q 26 8 38 18 Q 38 30 14 30 Z" fill="#1E293B"/>
      <path d="M 10 50 Q 26 40 42 50 L 40 95 L 12 95 Z" fill="#0284C7"/>
    </g>

    <!-- Next Carousel Floating Arrow -->
    <g transform="translate(160, 65)">
      <circle cx="15" cy="15" r="15" fill="rgba(0,0,0,0.3)"/>
      <text x="12" y="19" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">›</text>
      <text x="-16" y="19" font-family="'Segoe UI', sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">Next</text>
    </g>
  </g>
</svg>
