<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 210" width="100%" height="100%">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="yellowTag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="750" height="210" rx="14" fill="url(#redGrad)"/>

  <!-- Subtle circles pattern -->
  <circle cx="20" cy="20" r="80" fill="rgba(255,255,255,0.05)"/>
  <circle cx="450" cy="180" r="100" fill="rgba(255,255,255,0.06)"/>

  <!-- Left Header Area -->
  <g transform="translate(30, 42)">
    <text x="0" y="30" font-family="'Segoe UI', Inter, sans-serif" font-weight="900" font-size="32" fill="#FFFFFF">Career Start</text>
    
    <!-- Yellow Oval Badge "Karne ka" -->
    <g transform="translate(-2, 36)">
      <rect x="0" y="0" width="76" height="22" rx="11" fill="url(#yellowTag)"/>
      <text x="38" y="15" font-family="'Segoe UI', Inter, sans-serif" font-weight="800" font-size="11.5" fill="#B91C1C" text-anchor="middle">Karne ka</text>
    </g>

    <!-- Arrow icon -->
    <path d="M 110 45 Q 130 38 145 48" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <polygon points="146,45 150,50 144,51" fill="#FFFFFF"/>

    <!-- "Right Time ? Abhi!" -->
    <text x="0" y="90" font-family="'Segoe UI', Inter, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF">Right Time ? <tspan fill="#FEF08A">Abhi!</tspan></text>
  </g>

  <!-- Middle Details Section -->
  <g transform="translate(295, 38)">
    <text x="0" y="24" font-family="'Segoe UI', Inter, sans-serif" font-weight="700" font-size="13.5" fill="#FFF1F2">Experience ke saath, financial support!</text>
    <text x="0" y="52" font-family="'Segoe UI', Inter, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF">Minimum ₹9,000/month</text>
    
    <!-- Bullet points -->
    <g transform="translate(0, 76)">
      <text x="0" y="0" font-family="'Segoe UI', Inter, sans-serif" font-weight="500" font-size="12" fill="#FFE4E6">• Internship duration – 6 / 9 months</text>
      <text x="0" y="20" font-family="'Segoe UI', Inter, sans-serif" font-weight="500" font-size="12" fill="#FFE4E6">• Youth between 18–26 can apply</text>
    </g>
  </g>

  <!-- Right: Students Vector Graphic -->
  <g transform="translate(565, 30)">
    <!-- Student 1 -->
    <g transform="translate(0, 20)">
      <circle cx="24" cy="22" r="13" fill="#FCD9BD"/>
      <path d="M 12 18 Q 24 8 36 18 Q 36 30 12 30 Z" fill="#334155"/>
      <path d="M 8 50 Q 24 40 40 50 L 38 95 L 10 95 Z" fill="#3B82F6"/>
      <rect x="18" y="55" width="12" height="16" rx="2" fill="#FFFFFF"/>
      <rect x="20" y="58" width="8" height="4" fill="#3B82F6"/>
    </g>

    <!-- Student 2 (Center prominent female) -->
    <g transform="translate(32, 28)">
      <circle cx="24" cy="20" r="13" fill="#FCD9BD"/>
      <path d="M 8 24 Q 24 5 40 24 Q 42 45 6 45 Z" fill="#1E293B"/>
      <path d="M 8 50 Q 24 42 40 50 L 38 95 L 10 95 Z" fill="#F43F5E"/>
      <rect x="18" y="56" width="12" height="16" rx="2" fill="#FFFFFF"/>
      <rect x="20" y="59" width="8" height="4" fill="#F43F5E"/>
    </g>

    <!-- Student 3 -->
    <g transform="translate(64, 18)">
      <circle cx="24" cy="22" r="13" fill="#FCD9BD"/>
      <path d="M 12 18 Q 24 6 36 18 Q 36 30 12 30 Z" fill="#0F172A"/>
      <path d="M 8 50 Q 24 40 40 50 L 38 95 L 10 95 Z" fill="#10B981"/>
      <rect x="18" y="55" width="12" height="16" rx="2" fill="#FFFFFF"/>
    </g>

    <!-- Student 4 (Female) -->
    <g transform="translate(96, 26)">
      <circle cx="24" cy="20" r="13" fill="#FCD9BD"/>
      <path d="M 8 22 Q 24 5 40 22 Q 44 42 4 42 Z" fill="#475569"/>
      <path d="M 8 50 Q 24 42 40 50 L 38 95 L 10 95 Z" fill="#8B5CF6"/>
      <rect x="18" y="56" width="12" height="16" rx="2" fill="#FFFFFF"/>
    </g>

    <!-- Student 5 -->
    <g transform="translate(126, 20)">
      <circle cx="22" cy="22" r="12" fill="#FCD9BD"/>
      <path d="M 12 18 Q 22 8 32 18 Q 32 30 12 30 Z" fill="#1E293B"/>
      <path d="M 8 50 Q 22 40 36 50 L 34 95 L 10 95 Z" fill="#0284C7"/>
    </g>

    <!-- Next Carousel Floating Arrow -->
    <g transform="translate(142, 65)">
      <circle cx="14" cy="14" r="14" fill="rgba(0,0,0,0.3)"/>
      <text x="11" y="18" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">›</text>
      <text x="-16" y="18" font-family="'Segoe UI', sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">Next</text>
    </g>
  </g>
</svg>
