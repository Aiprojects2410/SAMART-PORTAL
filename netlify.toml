[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Access-Control-Allow-Origin = "*"

[[redirects]]
  from = "/api/*"
  to = "https://hxsdjyhkmoltzrdamruw.supabase.co/:splat"
  status = 200
  force = true
